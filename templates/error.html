<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error — StudyGenAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="{{ url_for('index') }}" class="nav-brand">
      <i class="fas fa-brain" aria-hidden="true"></i> StudyGenAI
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
      <i class="fas fa-moon" aria-hidden="true"></i>
    </button>
    <ul class="nav-links">
      <li><a href="{{ url_for('index') }}">Home</a></li>
      <li><a href="{{ url_for('generator') }}">Study Generator</a></li>
      <li><a href="{{ url_for('assistant') }}">AI Assistant</a></li>
      <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    </ul>
  </div>
</nav>

<main class="page-main container">
  <div class="error-page">
    <div class="error-icon" aria-hidden="true">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1>Something went wrong</h1>
    <p class="error-message">
      {{ error or "An unexpected error occurred. Please try again." }}
    </p>
    <div class="error-actions">
      <a href="{{ url_for('generator') }}" class="btn btn-primary">
        <i class="fas fa-redo"></i> Try Again
      </a>
      <a href="{{ url_for('index') }}" class="btn btn-outline">
        <i class="fas fa-home"></i> Go Home
      </a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p class="footer-copy">&copy; 2026 StudyGenAI — Integrates with IBM watsonx.ai &middot; IBM Langflow &middot; Groq API</p>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
